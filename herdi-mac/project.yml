name: Herdi
options:
  bundleIdPrefix: com.dcolinmorgan
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
targets:
  Herdi:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goingta.herdi
        MARKETING_VERSION: "0.8.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "NHN8A752UN"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: "0.8.1"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.goingta.herdi.focus
            CFBundleURLSchemes:
              - herdi
    entitlements:
      path: Herdi.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.goingta.herdi
    dependencies:
      - target: HerdiWidget
        embed: true

  HerdiWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goingta.herdi.widget
        MARKETING_VERSION: "0.8.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "NHN8A752UN"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
        GENERATE_INFOPLIST_FILE: true
    entitlements:
      path: HerdiWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.goingta.herdi
        # Read the menu-bar app's own defaults domain. The App Group container
        # binding never materialises for an unsandboxed host on a free team, and
        # cross-container writes are redirected by TCC — but the app natively
        # owns this domain, and this exception lets the sandboxed widget read it.
        com.apple.security.temporary-exception.shared-preference.read-only:
          - com.goingta.herdi
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
