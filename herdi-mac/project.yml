name: Herdi
options:
  bundleIdPrefix: com.dcolinmorgan
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
targets:
  Herdi:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goingta.herdi
        MARKETING_VERSION: "0.8.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "NHN8A752UN"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
        INFOPLIST_KEY_LSUIElement: true
        GENERATE_INFOPLIST_FILE: true
    entitlements:
      path: Herdi.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.goingta.herdi
    dependencies:
      - target: HerdiWidget
        embed: true

  HerdiWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goingta.herdi.widget
        MARKETING_VERSION: "0.8.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "NHN8A752UN"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
        GENERATE_INFOPLIST_FILE: true
    entitlements:
      path: HerdiWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.goingta.herdi
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
